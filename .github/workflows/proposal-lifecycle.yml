name: Proposal lifecycle

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, review_requested, review_request_removed]
  workflow_run:
    workflows: [App runtime validation, Proposal review event]
    types: [completed]
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write

concurrency:
  group: proposal-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify lifecycle logic
        run: python3 -m unittest discover -s tests -v
      - name: Process command and refresh merge eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/proposal_lifecycle.py
