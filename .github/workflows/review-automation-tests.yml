name: Review automation tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
      - 'proposals/templates/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
      - 'proposals/templates/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
