<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkstead Parking · PALE</title><link rel="stylesheet" href="/shared/style.css"><style>
body[data-app=parkstead-parking]{--accent:#176b68;--soft:#eaf7f5}.park-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:0 24px 28px}.park-card{border:1px solid var(--line);border-radius:12px;padding:18px;min-height:0}.park-card h3{font-size:15px;margin-bottom:8px}.park-card p{font-size:12px;color:#5d697a;margin:6px 0}.park-card .actions{margin-top:14px}.facility-art{height:74px;border-radius:9px;background:linear-gradient(135deg,#c7ece7,#dce8fb 55%,#ffd8b6);display:grid;place-items:center;font-size:28px;margin-bottom:14px}.price{font-size:22px;font-weight:700;color:var(--accent)}.search-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:18px 24px}.search-form label{font-size:11px;color:var(--muted)}.search-form label span{display:block;margin-bottom:5px}.workflow-note{margin:0 24px 18px;padding:12px 15px;border-radius:9px;background:var(--soft);font-size:12px}.empty-local{padding:34px;color:var(--muted);text-align:center}.compact-list{display:grid;gap:10px;padding:0 24px 28px}.compact-list .park-card{padding:16px}.stack{display:grid;gap:8px}.stack label{font-size:11px}.danger{color:#a63e34}@media(max-width:900px){.search-form{grid-template-columns:1fr 1fr}.search-form label:first-child{grid-column:1/-1}.search-form button{grid-column:1/-1}.park-grid{grid-template-columns:1fr}}
</style></head><body data-app="parkstead-parking"><div id="app"></div><script type="module" src="/app.js"></script></body></html>
