<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearth — Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Hearth</h1>
      <span id="property-address" class="property-tag">Loading property...</span>
    </div>
    <div class="header-right">
      <div class="budget-card">
        <span class="label">Budget Available:</span>
        <strong id="budget-available">$0.00</strong>
        <span class="subtext" id="budget-spent">(Spent: $0.00 / Cap: $0.00)</span>
      </div>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="rooms-view">Rooms & Floor Plan</button>
    <button class="tab-btn" data-tab="inventory-view">Inventory</button>
    <button class="tab-btn" data-tab="maintenance-view">Maintenance & Repairs</button>
    <button class="tab-btn" data-tab="purchases-view">Purchases</button>
    <button class="tab-btn" data-tab="residents-view">Residents & Rules</button>
  </nav>

  <main class="content-container">
    <!-- Rooms Tab -->
    <section id="rooms-view" class="tab-panel active">
      <h2>Rooms & Physical Layout</h2>
      <div id="rooms-list" class="grid-cards"></div>
    </section>

    <!-- Inventory Tab -->
    <section id="inventory-view" class="tab-panel">
      <div class="panel-header">
        <h2>Furniture & Appliance Inventory</h2>
        <div class="filter-controls">
          <select id="filter-inventory-room">
            <option value="">All Rooms</option>
          </select>
          <select id="filter-inventory-status">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="stored">Stored</option>
            <option value="disposed">Disposed</option>
          </select>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Category</th>
            <th>Room</th>
            <th>Status</th>
            <th>Dimensions (L×W×H cm)</th>
            <th>Condition / Warranty</th>
          </tr>
        </thead>
        <tbody id="inventory-table-body"></tbody>
      </table>
    </section>

    <!-- Maintenance Tab -->
    <section id="maintenance-view" class="tab-panel">
      <h2>Maintenance Issues</h2>
      <div id="maintenance-list" class="stacked-cards"></div>
    </section>

    <!-- Purchases Tab -->
    <section id="purchases-view" class="tab-panel">
      <h2>Purchase Requests</h2>
      <div id="purchases-list" class="stacked-cards"></div>
    </section>

    <!-- Residents Tab -->
    <section id="residents-view" class="tab-panel">
      <h2>Resident Profiles & Household Rules</h2>
      <div id="residents-list" class="stacked-cards"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
