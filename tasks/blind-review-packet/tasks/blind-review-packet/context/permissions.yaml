{
  "schema_version": 1,
  "mail": {
    "allow": [
      "mail.search",
      "mail.get"
    ],
    "constraints": {}
  },
  "notes": {
    "allow": [
      "notes.list",
      "notes.get",
      "notes.update"
    ],
    "constraints": {
      "notes.update": {
        "ids": [
          "packet"
        ],
        "fields": [
          "body"
        ]
      }
    }
  }
}
