schema_version = "1.4"
multi_step_reward_strategy = "final"

[task]
name = "karpning/blind-review-packet"
version = "0.1.0"
description = "Maintain a blind review packet across a mid-morning disclosure."
authors = [{ name = "karpning" }]

[environment]
cpus = 1
memory_mb = 768
storage_mb = 2048
network_mode = "no-network"
build_timeout_sec = 360

[environment.healthcheck]
command = "packet status"
interval_sec = 1
timeout_sec = 5
retries = 15

[agent]
user = "node"
timeout_sec = 900

[verifier]
user = "root"
timeout_sec = 120
environment_mode = "shared"

[[steps]]
name = "morning"

[[steps]]
name = "after-meeting"
