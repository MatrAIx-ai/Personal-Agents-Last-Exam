# Harbor task configuration for LifePack v1.0
version = "1.0"

[metadata]
id = "adaptive-household-organization"
title = "Adapt a home as household needs change"
primary_domain = "Home & utilities"
secondary_domains = ["Shopping & groceries"]
author = "nassimberrada"
