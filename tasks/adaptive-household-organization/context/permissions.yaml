schema: "pale.permissions.v1"
task_id: "adaptive-household-organization"
default_profile: "household_workspace"

agent:
  filesystem:
    read:
      - "workspace/**"
    write:
      - "workspace/layout_proposal.json"
      - "workspace/rationale.md"
      - "rationale.md"
  forbidden_paths:
    - "context/**"
    - "tests/**"
    - "solution/**"
    - "demo/**"
  actions:
    external_purchasing: false
    smart_home_control: false
    discard_heirloom: false
  confirmation_required:
    - "Any purchase recommendation exceeding $50"
    - "Moving or storing items in the basement locker"

verifier:
  read:
    - "workspace/layout_proposal.json"
    - "workspace/rationale.md"
    - "rationale.md"
    - "workspace/inventory.json"
    - "tests/**"
  write:
    - "/logs/verifier/**"
