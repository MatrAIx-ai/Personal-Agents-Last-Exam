services:
  main:
    build: .
    command: ["sleep", "infinity"]
    environment:
      FAMILY_ENDPOINT: http://household:8080/action
      FAMILY_SCORE: /family-result/score.json
    volumes:
      - family-result:/family-result:ro
    depends_on:
      household:
        condition: service_healthy
    networks: [family]
  household:
    build: .
    command: ["node", "/task/environment/service.cjs"]
    environment:
      PALE_ROOT: /pale
      PRIVATE_LOGS: /private
      RESULT_DIR: /result
      LISTEN_HOST: 0.0.0.0
      VARIANT: ${VARIANT:-main}
      REPLY: ${REPLY:-answered}
      HINT_MODE: ${HINT_MODE:-unhinted}
    volumes:
      - ../:/task:ro
      - ${PALE_ROOT:?set PALE_ROOT to the pinned PALE checkout}:/pale:ro
      - family-result:/result
      - family-private:/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [family]
volumes:
  family-result:
  family-private:
networks:
  family:
    internal: true
