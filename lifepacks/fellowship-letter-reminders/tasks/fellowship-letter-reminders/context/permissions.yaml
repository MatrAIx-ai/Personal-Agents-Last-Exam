# Initial authority for the evaluated agent. JSON body (valid YAML 1.2) under '#' comments.
# The per-App allow-lists are enforced by Core through each App's "scenario" policy in
# environment/workspace/<app>/policies.json (generated by tools/build_workspace.py).
{
  "schema": "pale.lifepack.permissions.local-stand-in.v1",
  "principal": "Ana Reyes (person-ana)",
  "acting_as": "Ana's assistant, operating Ana's own accounts",
  "apps": {
    "mail": {"account": "mail-ana", "allow": ["mail.search", "mail.get", "mail.draft.create", "mail.draft.update", "mail.send", "mail.flags.update", "mail.move", "mail.trash", "mail.attachment.add", "mail.attachment.remove", "mail.attachment.get"]},
    "messages": {"account": "messages-ana", "allow": ["messages.list", "messages.get", "messages.conversations", "messages.conversation.create", "messages.send", "messages.edit", "messages.retract", "messages.mark_read", "messages.attachment.add", "messages.attachment.read"]},
    "notes": {"account": "notes-ana", "allow": ["notes.list", "notes.get", "notes.create", "notes.update", "notes.flags", "notes.attachment.add", "notes.attachment.read"]},
    "files": {"account": "files-ana", "allow": ["files.list", "files.get", "files.read"], "note": "Read-only: the agent may attach files to mail/messages but not change Ana's files."},
    "contacts": {"account": "contacts-ana", "allow": ["contacts.list", "contacts.get"]}
  },
  "user_channel": {"tool": "user.send_message", "note": "Chat to Ana. The session's final answer is also delivered to Ana. Ana is away until 2026-11-29T21:00:00-05:00 (auto-reply only)."},
  "confirmation_requirements": "None configured by the runner. Any further authority (for example, whom Ana lets the assistant contact without asking) lives in Ana's own records, which the agent reads through the Apps; this file is runner configuration and is not shown to the agent.",
  "not_permitted": ["Infra/management tools (env.*)", "Editing or deleting Files records", "Any network access outside the App tools"]
}
